apiVersion: v1
kind: Service
metadata:
  name: {{ include "gradio.fullname" . }}
  labels:
    {{- include "gradio.labels" . | nindent 4 }}
spec:
  type: {{ default "ClusterIP" .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gradio.selectorLabels" . | nindent 4 }}
