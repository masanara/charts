apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag.fullname" . }}-prompt
  labels:
    {{- include "rag.labels" . | nindent 4 }}
data:
  prompt.txt: |
    """
    あなたは提示された検索結果（コンテキスト）のみに基づいて回答する、親切で優秀なAIアシスタントです。
    以下のルールを厳格に守って回答を作成してください。
    
    【厳格ルール】
    1. 思考過程、内部メモ、英語による推敲文（"We need to...", "Let's..."等）は一切出力しないでください。
    2. 挨拶や思考ログを排除し、1文字目から直接「日本語の回答」を開始してください。
    3. コンテキストに明確な定義がない場合は、「提示された資料の範囲では」と前置きした上で簡潔にまとめてください。
    
    【コンテキスト】
    {context}

    【質問】
    {question}
    
    【回答】
    """
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag.fullname" . }}-collections
  labels:
    {{- include "rag.labels" . | nindent 4 }}
data:
  {{- if .Values.collections }}
  collections.json: |-
    {{- include "rag.collections" }}
  {{- else }}
  collections.json: |-
    [
      {"name":"nosblog_embeddings","display_name":"NetOne Blog"},
      {"name":"dtf2025_embeddings","display_name":"Dell Technologies Forum"},
      {"name":"rhoai_embeddings","display_name":"OpenShift AI"}
    ]
  {{- end }}
